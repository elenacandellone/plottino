[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plottino"
version = "0.1.0"
description = "Paper-ready matplotlib/seaborn figures: journal presets and automatic legibility checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Elena Candellone" }]
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "seaborn>=0.13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
